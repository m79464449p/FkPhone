services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fkphone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - fkphone-postgres:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fkphone"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fkphone
      REDIS_URL: ""
      CRAWLER_WORKDIR: /app/crawler
      GOOFISH_PROFILE_DIR: /app/.goofish-profile
      GOOFISH_COOKIE_FILE: /app/.goofish-secrets/cookies.json
      GOOFISH_HEADLESS: "true"
      GOOFISH_SEARCH_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fkphone-goofish-profile:/app/.goofish-profile
      - fkphone-goofish-secrets:/app/.goofish-secrets
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  fkphone-postgres:
  fkphone-goofish-profile:
  fkphone-goofish-secrets:
