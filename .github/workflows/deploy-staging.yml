name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging server
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - fkphone
    environment: staging
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.event.workflow_run.head_sha }}

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config

      - name: Deploy
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Show service status
        run: docker compose -f deploy/docker-compose.yml ps
